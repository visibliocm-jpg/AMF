<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMF — Gestion de finances</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h3 {
    margin-top: 0;
    font-size: 15px;
    color: #6b7280;
}

.card .amount {
    font-size: 25px;
    font-weight: bold;
}

.balance {
    color: #2563eb;
}

.income {
    color: #16a34a;
}

.expense {
    color: #dc2626;
}

.actions {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

.btn-income {
    background: #16a34a;
    color: white;
}

.btn-expense {
    background: #dc2626;
    color: white;
}

.btn-budget {
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: 0.9;
}

section {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

section h2 {
    margin-top: 0;
}

/* BUDGETS */

.budget-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.budget-header h2 {
    margin: 0;
}

.budget-list {
    display: grid;
    gap: 15px;
}

.budget-item {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px;
}

.budget-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
}

.budget-name {
    font-weight: bold;
    font-size: 17px;
}

.budget-amount {
    text-align: right;
    font-size: 14px;
    color: #6b7280;
}

.progress-background {
    height: 14px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin: 10px 0;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    transition: width 0.3s;
}

.progress-normal {
    background: #2563eb;
}

.progress-warning {
    background: #f59e0b;
}

.progress-danger {
    background: #dc2626;
}

.budget-bottom {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
}

.budget-warning {
    color: #d97706;
    font-weight: bold;
}

.budget-danger {
    color: #dc2626;
    font-weight: bold;
}

.budget-ok {
    color: #16a34a;
    font-weight: bold;
}

.delete-budget {
    background: #fee2e2;
    color: #b91c1c;
    padding: 7px 10px;
    margin-top: 12px;
}

.empty {
    color: #6b7280;
    text-align: center;
    padding: 20px;
}

/* STATISTIQUES */

.statistics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.stat-box {
    background: #f9fafb;
    border-radius: 12px;
    padding: 18px;
}

.chart-row {
    margin-bottom: 18px;
}

.chart-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 14px;
}

.bar-background {
    height: 14px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    border-radius: 20px;
}

.income-bar {
    background: #16a34a;
}

.expense-bar {
    background: #dc2626;
}

.category-bar {
    background: #2563eb;
}

/* FILTRES */

.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
}

/* TRANSACTIONS */

.transaction {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 15px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-title {
    font-weight: bold;
}

.transaction-info {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
}

.transaction-amount {
    font-weight: bold;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
    padding: 8px 12px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 450px;
    border-radius: 15px;
    padding: 25px;
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.cancel-btn {
    background: #e5e7eb;
}

.save-btn {
    background: #2563eb;
    color: white;
}

/* MOBILE */

@media (max-width: 850px) {

    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .filters {
        grid-template-columns: 1fr 1fr;
    }

    .statistics-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .transaction {
        grid-template-columns: 1fr;
    }

    .budget-header {
        align-items: stretch;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>AMF — Application de gestion de finances</h1>
    <p>Gérez simplement vos revenus et vos dépenses</p>
</header>

<div class="container">

    <!-- TABLEAU DE BORD -->

    <div class="cards">

        <div class="card">
            <h3>Solde total</h3>
            <div class="amount balance" id="balance">
                0 FCFA
            </div>
        </div>

        <div class="card">
            <h3>Revenus</h3>
            <div class="amount income" id="totalIncome">
                0 FCFA
            </div>
        </div>

        <div class="card">
            <h3>Dépenses</h3>
            <div class="amount expense" id="totalExpense">
                0 FCFA
            </div>
        </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="btn-income"
            onclick="openTransactionModal('income')">
            + Ajouter un revenu
        </button>

        <button
            class="btn-expense"
            onclick="openTransactionModal('expense')">
            + Ajouter une dépense
        </button>

    </div>

    <!-- BUDGETS -->

    <section>

        <div class="budget-header">

            <h2>🎯 Mes budgets</h2>

            <button
                class="btn-budget"
                onclick="openBudgetModal()">
                + Ajouter un budget
            </button>

        </div>

        <div
            id="budgetList"
            class="budget-list">
        </div>

    </section>

    <!-- STATISTIQUES -->

    <section>

        <h2>📊 Statistiques</h2>

        <div class="statistics-grid">

            <div class="stat-box">

                <h3>Revenus vs dépenses</h3>

                <div id="comparisonChart"></div>

            </div>

            <div class="stat-box">

                <h3>Dépenses par catégorie</h3>

                <div id="categoryChart"></div>

            </div>

        </div>

    </section>

    <!-- TRANSACTIONS -->

    <section>

        <h2>💳 Transactions</h2>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Rechercher..."
                oninput="updateTransactions()">

            <select
                id="typeFilter"
                onchange="updateTransactions()">

                <option value="all">Tous les types</option>
                <option value="income">Revenus</option>
                <option value="expense">Dépenses</option>

            </select>

            <select
                id="categoryFilter"
                onchange="updateTransactions()">

                <option value="all">Toutes les catégories</option>

                <option>Alimentation</option>
                <option>Transport</option>
                <option>Logement</option>
                <option>Santé</option>
                <option>Éducation</option>
                <option>Shopping</option>
                <option>Loisirs</option>
                <option>Salaire</option>
                <option>Business</option>
                <option>Autre</option>

            </select>

            <input
                type="date"
                id="dateFilter"
                onchange="updateTransactions()">

        </div>

        <div id="transactionsList"></div>

    </section>

</div>


<!-- MODAL TRANSACTION -->

<div class="modal" id="transactionModal">

    <div class="modal-content">

        <h2 id="transactionModalTitle">
            Ajouter une transaction
        </h2>

        <div class="form-group">

            <label>Description</label>

            <input
                type="text"
                id="description"
                placeholder="Ex : Courses">

        </div>

        <div class="form-group">

            <label>Montant (FCFA)</label>

            <input
                type="number"
                id="amount"
                placeholder="Ex : 5000"
                min="1">

        </div>

        <div class="form-group">

            <label>Catégorie</label>

            <select id="category">

                <option>Alimentation</option>
                <option>Transport</option>
                <option>Logement</option>
                <option>Santé</option>
                <option>Éducation</option>
                <option>Shopping</option>
                <option>Loisirs</option>
                <option>Salaire</option>
                <option>Business</option>
                <option>Autre</option>

            </select>

        </div>

        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                id="date">

        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeTransactionModal()">
                Annuler
            </button>

            <button
                class="save-btn"
                onclick="saveTransaction()">
                Enregistrer
            </button>

        </div>

    </div>

</div>


<!-- MODAL BUDGET -->

<div class="modal" id="budgetModal">

    <div class="modal-content">

        <h2>🎯 Ajouter un budget</h2>

        <div class="form-group">

            <label>Catégorie</label>

            <select id="budgetCategory">

                <option>Alimentation</option>
                <option>Transport</option>
                <option>Logement</option>
                <option>Santé</option>
                <option>Éducation</option>
                <option>Shopping</option>
                <option>Loisirs</option>
                <option>Autre</option>

            </select>

        </div>

        <div class="form-group">

            <label>Budget mensuel (FCFA)</label>

            <input
                type="number"
                id="budgetAmount"
                placeholder="Ex : 100000"
                min="1">

        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeBudgetModal()">
                Annuler
            </button>

            <button
                class="save-btn"
                onclick="saveBudget()">
                Enregistrer
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   DONNÉES
========================= */

let transactions =
    JSON.parse(localStorage.getItem("amf_transactions")) || [];

let budgets =
    JSON.parse(localStorage.getItem("amf_budgets")) || [];

let currentType = "expense";


/* =========================
   FORMAT MONÉTAIRE
========================= */

function formatMoney(amount) {

    return new Intl.NumberFormat("fr-FR")
        .format(amount) + " FCFA";

}


/* =========================
   TRANSACTIONS
========================= */

function openTransactionModal(type) {

    currentType = type;

    document.getElementById("transactionModal")
        .style.display = "flex";

    document.getElementById("transactionModalTitle")
        .textContent =
        type === "income"
        ? "Ajouter un revenu"
        : "Ajouter une dépense";

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";

    document.getElementById("category").value =
        type === "income"
        ? "Salaire"
        : "Alimentation";

    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];
}


function closeTransactionModal() {

    document.getElementById("transactionModal")
        .style.display = "none";

}


function saveTransaction() {

    const description =
        document.getElementById("description")
        .value.trim();

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const category =
        document.getElementById("category").value;

    const date =
        document.getElementById("date").value;

    if (!description || !amount || amount <= 0 || !date) {

        alert(
            "Veuillez remplir correctement tous les champs."
        );

        return;
    }

    const transaction = {

        id: Date.now(),

        description: description,

        amount: amount,

        type: currentType,

        category: category,

        date: date

    };

    transactions.push(transaction);

    localStorage.setItem(
        "amf_transactions",
        JSON.stringify(transactions)
    );

    closeTransactionModal();

    updateDashboard();
}


function deleteTransaction(id) {

    if (!confirm("Supprimer cette transaction ?")) {
        return;
    }

    transactions =
        transactions.filter(t => t.id !== id);

    localStorage.setItem(
        "amf_transactions",
        JSON.stringify(transactions)
    );

    updateDashboard();
}


/* =========================
   DASHBOARD
========================= */

function updateDashboard() {

    let totalIncome = 0;
    let totalExpense = 0;

    transactions.forEach(t => {

        if (t.type === "income") {

            totalIncome += Number(t.amount);

        } else {

            totalExpense += Number(t.amount);

        }

    });

    const balance =
        totalIncome - totalExpense;

    document.getElementById("balance")
        .textContent =
        formatMoney(balance);

    document.getElementById("totalIncome")
        .textContent =
        formatMoney(totalIncome);

    document.getElementById("totalExpense")
        .textContent =
        formatMoney(totalExpense);

    updateTransactions();

    updateStatistics();

    updateBudgets();
}


/* =========================
   LISTE DES TRANSACTIONS
========================= */

function updateTransactions() {

    const search =
        document.getElementById("searchInput")
        .value.toLowerCase();

    const type =
        document.getElementById("typeFilter").value;

    const category =
        document.getElementById("categoryFilter").value;

    const date =
        document.getElementById("dateFilter").value;

    const filtered =
        transactions.filter(t => {

            const matchesSearch =
                t.description
                    .toLowerCase()
                    .includes(search)
                ||
                t.category
                    .toLowerCase()
                    .includes(search);

            const matchesType =
                type === "all" ||
                t.type === type;

            const matchesCategory =
                category === "all" ||
                t.category === category;

            const matchesDate =
                !date ||
                t.date === date;

            return (
                matchesSearch &&
                matchesType &&
                matchesCategory &&
                matchesDate
            );

        });

    const container =
        document.getElementById("transactionsList");

    if (filtered.length === 0) {

        container.innerHTML =
            `<div class="empty">
                Aucune transaction trouvée.
            </div>`;

        return;
    }

    filtered.sort((a,b) =>
        new Date(b.date) - new Date(a.date)
    );

    container.innerHTML =
        filtered.map(t => {

            const sign =
                t.type === "income"
                ? "+"
                : "-";

            const amountClass =
                t.type === "income"
                ? "income"
                : "expense";

            return `

                <div class="transaction">

                    <div>

                        <div class="transaction-title">
                            ${escapeHTML(t.description)}
                        </div>

                        <div class="transaction-info">
                            ${escapeHTML(t.category)}
                            ·
                            ${t.date}
                        </div>

                    </div>

                    <div class="transaction-amount ${amountClass}">
                        ${sign} ${formatMoney(Number(t.amount))}
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${t.id})">
                        Supprimer
                    </button>

                </div>

            `;

        }).join("");
}


/* =========================
   STATISTIQUES
========================= */

function updateStatistics() {

    let totalIncome = 0;
    let totalExpense = 0;

    const categories = {};

    transactions.forEach(t => {

        const amount = Number(t.amount);

        if (t.type === "income") {

            totalIncome += amount;

        } else {

            totalExpense += amount;

            if (!categories[t.category]) {
                categories[t.category] = 0;
            }

            categories[t.category] += amount;
        }

    });


    const comparison =
        document.getElementById("comparisonChart");

    if (totalIncome === 0 && totalExpense === 0) {

        comparison.innerHTML =
            `<div class="empty">
                Ajoutez des transactions pour voir vos statistiques.
            </div>`;

    } else {

        const max =
            Math.max(totalIncome, totalExpense);

        const incomeWidth =
            max > 0
            ? (totalIncome / max) * 100
            : 0;

        const expenseWidth =
            max > 0
            ? (totalExpense / max) * 100
            : 0;

        comparison.innerHTML = `

            <div class="chart-row">

                <div class="chart-label">

                    <strong>Revenus</strong>

                    <span>
                        ${formatMoney(totalIncome)}
                    </span>

                </div>

                <div class="bar-background">

                    <div
                        class="bar income-bar"
                        style="width:${incomeWidth}%">
                    </div>

                </div>

            </div>

            <div class="chart-row">

                <div class="chart-label">

                    <strong>Dépenses</strong>

                    <span>
                        ${formatMoney(totalExpense)}
                    </span>

                </div>

                <div class="bar-background">

                    <div
                        class="bar expense-bar"
                        style="width:${expenseWidth}%">
                    </div>

                </div>

            </div>
        `;
    }


    const categoryChart =
        document.getElementById("categoryChart");

    const sortedCategories =
        Object.entries(categories)
        .sort((a,b) => b[1] - a[1]);

    if (sortedCategories.length === 0) {

        categoryChart.innerHTML =
            `<div class="empty">
                Aucune dépense enregistrée.
            </div>`;

        return;
    }

    const maxCategory =
        sortedCategories[0][1];

    categoryChart.innerHTML =
        sortedCategories.map(([category, amount]) => {

            const width =
                (amount / maxCategory) * 100;

            const percentage =
                totalExpense > 0
                ? ((amount / totalExpense) * 100).toFixed(1)
                : 0;

            return `

                <div class="chart-row">

                    <div class="chart-label">

                        <strong>
                            ${escapeHTML(category)}
                        </strong>

                        <span>
                            ${formatMoney(amount)}
                            · ${percentage}%
                        </span>

                    </div>

                    <div class="bar-background">

                        <div
                            class="bar category-bar"
                            style="width:${width}%">
                        </div>

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================
   BUDGETS
========================= */

function openBudgetModal() {

    document.getElementById("budgetModal")
        .style.display = "flex";

    document.getElementById("budgetAmount")
        .value = "";

}


function closeBudgetModal() {

    document.getElementById("budgetModal")
        .style.display = "none";

}


function saveBudget() {

    const category =
        document.getElementById("budgetCategory")
        .value;

    const amount =
        Number(
            document.getElementById("budgetAmount")
            .value
        );

    if (!amount || amount <= 0) {

        alert("Veuillez entrer un budget valide.");

        return;
    }


    const existing =
        budgets.find(
            b => b.category === category
        );


    if (existing) {

        existing.amount = amount;

    } else {

        budgets.push({

            id: Date.now(),

            category: category,

            amount: amount

        });

    }


    localStorage.setItem(
        "amf_budgets",
        JSON.stringify(budgets)
    );

    closeBudgetModal();

    updateBudgets();
}


function deleteBudget(id) {

    if (!confirm("Supprimer ce budget ?")) {
        return;
    }

    budgets =
        budgets.filter(b => b.id !== id);

    localStorage.setItem(
        "amf_budgets",
        JSON.stringify(budgets)
    );

    updateBudgets();
}


function updateBudgets() {

    const container =
        document.getElementById("budgetList");

    if (budgets.length === 0) {

        container.innerHTML =
            `<div class="empty">
                Aucun budget configuré.
                <br>
                Cliquez sur « + Ajouter un budget » pour commencer.
            </div>`;

        return;
    }


    const today = new Date();

    const currentMonth =
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1)
            .padStart(2, "0");


    container.innerHTML =
        budgets.map(budget => {

            let spent = 0;

            transactions.forEach(t => {

                if (
                    t.type === "expense" &&
                    t.category === budget.category &&
                    t.date.startsWith(currentMonth)
                ) {

                    spent += Number(t.amount);

                }

            });


            const budgetAmount =
                Number(budget.amount);

            const remaining =
                budgetAmount - spent;

            const percentage =
                budgetAmount > 0
                ? (spent / budgetAmount) * 100
                : 0;

            const progress =
                Math.min(percentage, 100);


            let progressClass =
                "progress-normal";

            let statusClass =
                "budget-ok";

            let statusText =
                "Budget maîtrisé";


            if (percentage >= 100) {

                progressClass =
                    "progress-danger";

                statusClass =
                    "budget-danger";

                statusText =
                    "⚠️ Budget dépassé";

            } else if (percentage >= 80) {

                progressClass =
                    "progress-warning";

                statusClass =
                    "budget-warning";

                statusText =
                    "⚠️ Attention au budget";

            }


            return `

                <div class="budget-item">

                    <div class="budget-top">

                        <div class="budget-name">
                            ${escapeHTML(budget.category)}
                        </div>

                        <div class="budget-amount">

                            Budget :
                            ${formatMoney(budgetAmount)}

                            <br>

                            Dépensé :
                            ${formatMoney(spent)}

                        </div>

                    </div>


                    <div class="progress-background">

                        <div
                            class="progress-bar ${progressClass}"
                            style="width:${progress}%">
                        </div>

                    </div>


                    <div class="budget-bottom">

                        <span class="${statusClass}">
                            ${statusText}
                        </span>

                        <span>
                            ${percentage.toFixed(0)}% utilisé
                        </span>

                    </div>


                    <div class="budget-bottom">

                        <span>

                            ${
                                remaining >= 0
                                ? "Reste : " + formatMoney(remaining)
                                : "Dépassement : " + formatMoney(Math.abs(remaining))
                            }

                        </span>

                    </div>


                    <button
                        class="delete-budget"
                        onclick="deleteBudget(${budget.id})">

                        Supprimer le budget

                    </button>

                </div>

            `;

        }).join("");
}


/* =========================
   SÉCURITÉ
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   INITIALISATION
========================= */

updateDashboard();

</script>
