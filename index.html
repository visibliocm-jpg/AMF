<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMF — Gestion de finances</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    padding: 22px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h3 {
    margin-top: 0;
    font-size: 15px;
    color: #6b7280;
}

.card .amount {
    font-size: 25px;
    font-weight: bold;
}

.balance {
    color: #2563eb;
}

.income {
    color: #16a34a;
}

.expense {
    color: #dc2626;
}

.actions {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

.btn-income {
    background: #16a34a;
    color: white;
}

.btn-expense {
    background: #dc2626;
    color: white;
}

button:hover {
    opacity: 0.9;
}

section {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

section h2 {
    margin-top: 0;
}

/* Filtres */

.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
}

/* Transactions */

.transaction {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 15px;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-title {
    font-weight: bold;
}

.transaction-info {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
}

.transaction-amount {
    font-weight: bold;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
    padding: 8px 12px;
}

/* Statistiques */

.statistics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.stat-box {
    background: #f9fafb;
    border-radius: 12px;
    padding: 18px;
}

.chart-row {
    margin-bottom: 18px;
}

.chart-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 14px;
}

.chart-label strong {
    font-weight: bold;
}

.bar-background {
    height: 14px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    border-radius: 20px;
}

.income-bar {
    background: #16a34a;
}

.expense-bar {
    background: #dc2626;
}

.category-bar {
    background: #2563eb;
}

.empty {
    color: #6b7280;
    text-align: center;
    padding: 20px;
}

/* Modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 450px;
    border-radius: 15px;
    padding: 25px;
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.cancel-btn {
    background: #e5e7eb;
}

.save-btn {
    background: #2563eb;
    color: white;
}

/* Mobile */

@media (max-width: 850px) {

    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .filters {
        grid-template-columns: 1fr 1fr;
    }

    .statistics-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    .container {
        padding: 15px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .transaction {
        grid-template-columns: 1fr;
        gap: 7px;
    }
}
</style>
</head>

<body>

<header>
    <h1>AMF — Application de gestion de finances</h1>
    <p>Gérez simplement vos revenus et vos dépenses</p>
</header>

<div class="container">

    <!-- TABLEAU DE BORD -->

    <div class="cards">

        <div class="card">
            <h3>Solde total</h3>
            <div class="amount balance" id="balance">
                0 FCFA
            </div>
        </div>

        <div class="card">
            <h3>Revenus</h3>
            <div class="amount income" id="totalIncome">
                0 FCFA
            </div>
        </div>

        <div class="card">
            <h3>Dépenses</h3>
            <div class="amount expense" id="totalExpense">
                0 FCFA
            </div>
        </div>

    </div>

    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="btn-income"
            onclick="openModal('income')">
            + Ajouter un revenu
        </button>

        <button
            class="btn-expense"
            onclick="openModal('expense')">
            + Ajouter une dépense
        </button>

    </div>

    <!-- STATISTIQUES -->

    <section>

        <h2>📊 Statistiques</h2>

        <div class="statistics-grid">

            <div class="stat-box">

                <h3>Revenus vs dépenses</h3>

                <div id="comparisonChart"></div>

            </div>

            <div class="stat-box">

                <h3>Dépenses par catégorie</h3>

                <div id="categoryChart"></div>

            </div>

        </div>

    </section>

    <!-- TRANSACTIONS -->

    <section>

        <h2>💳 Transactions</h2>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Rechercher..."
                oninput="updateTransactions()">

            <select
                id="typeFilter"
                onchange="updateTransactions()">

                <option value="all">Tous les types</option>
                <option value="income">Revenus</option>
                <option value="expense">Dépenses</option>

            </select>

            <select
                id="categoryFilter"
                onchange="updateTransactions()">

                <option value="all">Toutes les catégories</option>

                <option>Alimentation</option>
                <option>Transport</option>
                <option>Logement</option>
                <option>Santé</option>
                <option>Éducation</option>
                <option>Shopping</option>
                <option>Loisirs</option>
                <option>Salaire</option>
                <option>Business</option>
                <option>Autre</option>

            </select>

            <input
                type="date"
                id="dateFilter"
                onchange="updateTransactions()">

        </div>

        <div id="transactionsList"></div>

    </section>

</div>

<!-- MODAL -->

<div class="modal" id="transactionModal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Ajouter une transaction
        </h2>

        <div class="form-group">

            <label>Description</label>

            <input
                type="text"
                id="description"
                placeholder="Ex : Courses">

        </div>

        <div class="form-group">

            <label>Montant (FCFA)</label>

            <input
                type="number"
                id="amount"
                placeholder="Ex : 5000"
                min="1">

        </div>

        <div class="form-group">

            <label>Catégorie</label>

            <select id="category">

                <option>Alimentation</option>
                <option>Transport</option>
                <option>Logement</option>
                <option>Santé</option>
                <option>Éducation</option>
                <option>Shopping</option>
                <option>Loisirs</option>
                <option>Salaire</option>
                <option>Business</option>
                <option>Autre</option>

            </select>

        </div>

        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                id="date">

        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal()">
                Annuler
            </button>

            <button
                class="save-btn"
                onclick="saveTransaction()">
                Enregistrer
            </button>

        </div>

    </div>

</div>

<script>

let transactions =
    JSON.parse(localStorage.getItem("amf_transactions")) || [];

let currentType = "expense";


/* FORMAT MONÉTAIRE */

function formatMoney(amount) {

    return new Intl.NumberFormat("fr-FR")
        .format(amount) + " FCFA";

}


/* OUVRIR MODAL */

function openModal(type) {

    currentType = type;

    document.getElementById("transactionModal").style.display = "flex";

    document.getElementById("modalTitle").textContent =
        type === "income"
        ? "Ajouter un revenu"
        : "Ajouter une dépense";

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";

    document.getElementById("category").value =
        type === "income"
        ? "Salaire"
        : "Alimentation";

    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];
}


/* FERMER MODAL */

function closeModal() {

    document.getElementById("transactionModal").style.display = "none";

}


/* ENREGISTRER */

function saveTransaction() {

    const description =
        document.getElementById("description").value.trim();

    const amount =
        Number(document.getElementById("amount").value);

    const category =
        document.getElementById("category").value;

    const date =
        document.getElementById("date").value;

    if (!description || !amount || amount <= 0 || !date) {

        alert("Veuillez remplir correctement tous les champs.");

        return;
    }

    const transaction = {

        id: Date.now(),

        description: description,

        amount: amount,

        type: currentType,

        category: category,

        date: date

    };

    transactions.push(transaction);

    localStorage.setItem(
        "amf_transactions",
        JSON.stringify(transactions)
    );

    closeModal();

    updateDashboard();

}


/* SUPPRIMER */

function deleteTransaction(id) {

    if (!confirm("Supprimer cette transaction ?")) {
        return;
    }

    transactions =
        transactions.filter(t => t.id !== id);

    localStorage.setItem(
        "amf_transactions",
        JSON.stringify(transactions)
    );

    updateDashboard();

}


/* TABLEAU DE BORD */

function updateDashboard() {

    let totalIncome = 0;
    let totalExpense = 0;

    transactions.forEach(t => {

        if (t.type === "income") {

            totalIncome += t.amount;

        } else {

            totalExpense += t.amount;

        }

    });

    const balance =
        totalIncome - totalExpense;

    document.getElementById("balance").textContent =
        formatMoney(balance);

    document.getElementById("totalIncome").textContent =
        formatMoney(totalIncome);

    document.getElementById("totalExpense").textContent =
        formatMoney(totalExpense);

    updateTransactions();

    updateStatistics();

}


/* TRANSACTIONS */

function updateTransactions() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const type =
        document.getElementById("typeFilter").value;

    const category =
        document.getElementById("categoryFilter").value;

    const date =
        document.getElementById("dateFilter").value;

    const filtered =
        transactions.filter(t => {

            const matchesSearch =
                t.description
                    .toLowerCase()
                    .includes(search)
                ||
                t.category
                    .toLowerCase()
                    .includes(search);

            const matchesType =
                type === "all" ||
                t.type === type;

            const matchesCategory =
                category === "all" ||
                t.category === category;

            const matchesDate =
                !date ||
                t.date === date;

            return (
                matchesSearch &&
                matchesType &&
                matchesCategory &&
                matchesDate
            );

        });

    const container =
        document.getElementById("transactionsList");

    if (filtered.length === 0) {

        container.innerHTML =
            `<div class="empty">
                Aucune transaction trouvée.
            </div>`;

        return;
    }

    filtered.sort((a,b) =>
        new Date(b.date) - new Date(a.date)
    );

    container.innerHTML =
        filtered.map(t => {

            const sign =
                t.type === "income" ? "+" : "-";

            const amountClass =
                t.type === "income"
                ? "income"
                : "expense";

            return `

                <div class="transaction">

                    <div>

                        <div class="transaction-title">
                            ${escapeHTML(t.description)}
                        </div>

                        <div class="transaction-info">
                            ${escapeHTML(t.category)}
                            ·
                            ${t.date}
                        </div>

                    </div>

                    <div class="transaction-amount ${amountClass}">
                        ${sign} ${formatMoney(t.amount)}
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${t.id})">
                        Supprimer
                    </button>

                </div>

            `;

        }).join("");

}


/* STATISTIQUES */

function updateStatistics() {

    let totalIncome = 0;
    let totalExpense = 0;

    const categories = {};

    transactions.forEach(t => {

        if (t.type === "income") {

            totalIncome += t.amount;

        } else {

            totalExpense += t.amount;

            if (!categories[t.category]) {
                categories[t.category] = 0;
            }

            categories[t.category] += t.amount;

        }

    });


    /* REVENUS VS DÉPENSES */

    const comparison =
        document.getElementById("comparisonChart");

    if (totalIncome === 0 && totalExpense === 0) {

        comparison.innerHTML =
            `<div class="empty">
                Ajoutez des transactions pour voir vos statistiques.
            </div>`;

    } else {

        const max =
            Math.max(totalIncome, totalExpense);

        const incomeWidth =
            max > 0
            ? (totalIncome / max) * 100
            : 0;

        const expenseWidth =
            max > 0
            ? (totalExpense / max) * 100
            : 0;

        comparison.innerHTML = `

            <div class="chart-row">

                <div class="chart-label">

                    <strong>Revenus</strong>

                    <span>
                        ${formatMoney(totalIncome)}
                    </span>

                </div>

                <div class="bar-background">

                    <div
                        class="bar income-bar"
                        style="width:${incomeWidth}%">
                    </div>

                </div>

            </div>


            <div class="chart-row">

                <div class="chart-label">

                    <strong>Dépenses</strong>

                    <span>
                        ${formatMoney(totalExpense)}
                    </span>

                </div>

                <div class="bar-background">

                    <div
                        class="bar expense-bar"
                        style="width:${expenseWidth}%">
                    </div>

                </div>

            </div>

        `;

    }


    /* DÉPENSES PAR CATÉGORIE */

    const categoryChart =
        document.getElementById("categoryChart");

    const sortedCategories =
        Object.entries(categories)
        .sort((a,b) => b[1] - a[1]);

    if (sortedCategories.length === 0) {

        categoryChart.innerHTML =
            `<div class="empty">
                Aucune dépense enregistrée.
            </div>`;

        return;

    }

    const maxCategory =
        sortedCategories[0][1];

    categoryChart.innerHTML =
        sortedCategories.map(([category, amount]) => {

            const width =
                (amount / maxCategory) * 100;

            const percentage =
                totalExpense > 0
                ? ((amount / totalExpense) * 100).toFixed(1)
                : 0;

            return `

                <div class="chart-row">

                    <div class="chart-label">

                        <strong>
                            ${escapeHTML(category)}
                        </strong>

                        <span>
                            ${formatMoney(amount)}
                            · ${percentage}%
                        </span>

                    </div>

                    <div class="bar-background">

                        <div
                            class="bar category-bar"
                            style="width:${width}%">
                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* SÉCURISER L'AFFICHAGE DU TEXTE */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* INITIALISATION */

updateDashboard();

</script>

</body>
</html>
