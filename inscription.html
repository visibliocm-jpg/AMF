<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - AMF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #1f2937;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .connexion {
      text-align: center;
      margin-top: 20px;
    }

    .connexion a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Créer un compte</h1>

    <p class="description">
      Bienvenue sur AMF, votre gestionnaire de finances personnelles.
    </p>

    <form id="inscriptionForm">

      <label for="nom">Nom</label>
      <input
        type="text"
        id="nom"
        placeholder="Votre nom"
        required
      >

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        required
      >

      <label for="motDePasse">Mot de passe</label>
      <input
        type="password"
        id="motDePasse"
        placeholder="Votre mot de passe"
        required
      >

      <label for="confirmation">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmation"
        placeholder="Confirmez votre mot de passe"
        required
      >

      <button type="submit">
        Créer mon compte
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="connexion">
      Déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </div>

  </div>

  <script src="authentification.js"></script>
  <script src="session.js"></script>

</body>
</html>
